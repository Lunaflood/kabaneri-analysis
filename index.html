<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スロット解析データ 機種一覧</title>
  <style>

    :root{--bg:#f4f1e9;--panel:#fffdf8;--ink:#1d2424;--muted:#65706d;--line:#d8d0bf;--green:#176f5f;--gold:#9a6d1f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;letter-spacing:0}
    header{padding:22px clamp(14px,4vw,46px) 16px;background:#fff8ea;border-bottom:1px solid var(--line)}
    h1{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.2}
    .lead{margin:0;max-width:1120px;color:var(--muted);font-size:14px;line-height:1.7}
    main{padding:16px clamp(14px,4vw,46px) 42px}
    .nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
    .nav a{color:var(--green);font-weight:800;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;font-size:13px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:1120px;margin:0 0 14px}
    .metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
    .metric{padding:10px}.metric b{display:block;font-size:21px}.metric span{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.summary{grid-template-columns:1fr 1fr}}

    .section-title{font-size:17px;margin:0 0 10px}
    .machine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;max-width:1120px}
    .machine{display:grid;grid-template-rows:auto 1fr;min-height:190px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit}
    .machine:hover{border-color:#9ab7ad;box-shadow:0 8px 20px rgba(29,36,36,.08)}
    .machine-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);background:#fff}
    .machine-name{font-size:20px;font-weight:900;line-height:1.35}
    .machine-name small{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}
    .status{display:inline-block;margin-top:10px;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;background:#e8f2ee;color:var(--green)}
    .status.soon{background:#eee9df;color:var(--gold)}
    .machine-body{padding:12px 14px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
    .stat{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px}
    .stat b{display:block;font-size:18px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.machine{min-height:auto}}
  </style>
</head>
<body>
  <header>
    <h1>スロット解析データ</h1>
    <p class="lead">機種ごとに、保存済み履歴と条件分析を整理していくトップページです。</p>
  </header>
  <main>
    <h2 class="section-title">機種一覧</h2>
    <div class="machine-grid">
      <a class="machine" href="machine_kabaneri.html">
        <div class="machine-head">
          <div class="machine-name">スマスロ 甲鉄城のカバネリ 海門決戦<small>Kabaneri Kaimon Kessen</small></div>
          <span class="status">分析ページあり</span>
        </div>
        <div class="machine-body">
          <div class="stats">
            <div class="stat"><b>263,950</b><span>履歴</span></div>
            <div class="stat"><b>4,823</b><span>台日</span></div>
            <div class="stat"><b>37</b><span>店舗</span></div>
            <div class="stat"><b>18,275,074G</b><span>累計ゲーム</span></div>
          </div>
        </div>
      </a>

      <a class="machine" href="machine_million_god.html">
        <div class="machine-head">
          <div class="machine-name">スマスロ ミリオンゴッド-神々の軌跡-<small>Million God Kamigami no Kiseki</small></div>
          <span class="status soon">保存データあり</span>
        </div>
        <div class="machine-body">
          <div class="stats">
            <div class="stat"><b>123,205</b><span>履歴</span></div>
            <div class="stat"><b>3,559</b><span>台日</span></div>
            <div class="stat"><b>38</b><span>店舗</span></div>
            <div class="stat"><b>23,943,391G</b><span>累計ゲーム</span></div>
          </div>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
