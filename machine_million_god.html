<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ミリオンゴッド 準備中</title>
  <style>

    :root{--bg:#f4f1e9;--panel:#fffdf8;--ink:#1d2424;--muted:#65706d;--line:#d8d0bf;--green:#176f5f;--gold:#9a6d1f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;letter-spacing:0}
    header{padding:22px clamp(14px,4vw,46px) 16px;background:#fff8ea;border-bottom:1px solid var(--line)}
    h1{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.2}
    .lead{margin:0;max-width:1120px;color:var(--muted);font-size:14px;line-height:1.7}
    main{padding:16px clamp(14px,4vw,46px) 42px}
    .nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
    .nav a{color:var(--green);font-weight:800;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;font-size:13px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:1120px;margin:0 0 14px}
    .metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
    .metric{padding:10px}.metric b{display:block;font-size:21px}.metric span{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.summary{grid-template-columns:1fr 1fr}}

    .panel{max-width:920px;padding:14px;line-height:1.75}
    .status{display:inline-block;border-radius:999px;background:#eee9df;color:var(--gold);padding:5px 8px;font-size:12px;font-weight:900;margin-bottom:8px}
  </style>
</head>
<body>
  <header>
    <h1>スマスロ ミリオンゴッド-神々の軌跡-</h1>
    <p class="lead">保存済みデータはあります。分析ページはこれから追加します。</p>
  </header>
  <main>
    <div class="nav">
      <a href="index.html">機種一覧</a>
    </div>
    <div class="summary">
      <div class="metric"><b>103,985</b><span>履歴</span></div>
      <div class="metric"><b>3,046</b><span>台日</span></div>
      <div class="metric"><b>33</b><span>店舗</span></div>
      <div class="metric"><b>20,308,594G</b><span>総ゲーム</span></div>
    </div>
    <div class="panel">
      <span class="status">準備中</span>
      <div>ゴッドは機種一覧には追加済みです。条件分析や台別履歴ページを作ったら、このページに一覧として並べます。</div>
    </div>
  </main>
</body>
</html>
